name: Publicar calendário

on:
  push:
    branches: [main, claude/trello-calendar-integration-bpyxkx]
  workflow_dispatch:
  schedule:
    # a cada hora, para puxar mudanças de quadros públicos do Trello
    - cron: '17 * * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        if: ${{ vars.TRELLO_BOARDS != '' }}
        with:
          node-version: 20

      - name: Baixar quadros públicos do Trello
        if: ${{ vars.TRELLO_BOARDS != '' }}
        env:
          TRELLO_BOARDS: ${{ vars.TRELLO_BOARDS }}
        run: node scripts/fetch-trello.mjs

      - name: Montar site
        run: |
          mkdir -p _site
          cp index.html app.js style.css _site/
          cp -r data _site/data

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
